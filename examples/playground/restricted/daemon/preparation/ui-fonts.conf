<?xml version="1.0"?>
<!-- Fixed trusted UI image font root; no includes, host directories or web fonts. -->
<fontconfig>
  <dir>/resources/fonts</dir>
  <cachedir>/tmp/zryna-fontconfig-cache</cachedir>
  <alias><family>Sans</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Nimbus Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Nimbus Mono PS</family></prefer></alias>
  <alias><family>ui-monospace</family><prefer><family>Nimbus Mono PS</family></prefer></alias>
</fontconfig>
