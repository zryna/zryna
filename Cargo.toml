[workspace]
resolver = "2"
members = [
  "apps/zryna",
  "crates/zryna-architecture",
  "crates/zryna-backend-javascript",
  "crates/zryna-backend-native",
  "crates/zryna-diagnostics",
  "crates/zryna-driver",
  "crates/zryna-frontend",
  "crates/zryna-ir",
  "crates/zryna-native-mir",
  "crates/zryna-source",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zryna/zryna"
homepage = "https://zryna.com"
authors = ["Aditya Nandlal"]

[workspace.dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
libc = "0.2"
same-file = "1.0.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
toml = "0.9.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
