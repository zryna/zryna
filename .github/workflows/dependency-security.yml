name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: dependency security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check Python requirement
        run: python -c "import sys; assert sys.version_info >= (3, 11)"
      - name: Run advisory capture regression tests
        run: python -B -m unittest discover -s tests/dependency-audit -p 'test_*.py' -v
      - name: Run dependency lock parser tests
        run: node --test --test-reporter=tap tests/dependency-lock-parser.test.mjs
      - name: Run exact-lock advisory and backport checks
        shell: pwsh
        run: |
          $checkoutRoot = (& node -p 'require("node:fs").realpathSync(".")').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Checkout path resolution failed' }
          $admittedNode = (& node -p 'require("node:fs").realpathSync(process.execPath)').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Node path resolution failed' }
          $auditOutput = (& node -p 'require("node:path").join(require("node:fs").realpathSync(process.env.RUNNER_TEMP), "zryna-dependency-security")').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Output path resolution failed' }
          python -B scripts/stability-gates/dependency_audit.py --root "$checkoutRoot" --node "$admittedNode" --output "$auditOutput"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency gate failed; retained evidence is required for diagnosis' }
      - name: Retain raw advisory and SDK evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-${{ matrix.os }}
          path: ${{ runner.temp }}/zryna-dependency-security
          if-no-files-found: error
