name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: dependency security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare locked Rust sources outside advisory and owner execution
        run: cargo fetch --locked
      - name: Check Python requirement
        run: python -c "import sys; assert sys.version_info >= ((3, 12) if sys.platform == 'win32' else (3, 11))"
      - name: Run advisory capture regression tests
        run: python -B -m unittest discover -s tests/dependency-audit -p 'test_*.py' -v
      - name: Run dependency lock parser tests
        run: node --test --test-reporter=tap tests/dependency-lock-parser.test.mjs tests/dependency-audit/block-buffer-owner.test.mjs
      - name: Run exact-lock advisory and backport checks
        shell: pwsh
        run: |
          $checkoutRoot = (& node -p 'require("node:fs").realpathSync(".")').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Checkout path resolution failed' }
          $admittedNode = (& node -p 'require("node:fs").realpathSync(process.execPath)').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Node path resolution failed' }
          $auditOutput = (& node -p 'require("node:path").join(require("node:fs").realpathSync(process.env.RUNNER_TEMP), "zryna-dependency-security")').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Output path resolution failed' }
          $admittedCargo = (& rustup which --toolchain 1.97.1 cargo).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Cargo selection failed' }
          $admittedRustc = (& rustup which --toolchain 1.97.1 rustc).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Pinned rustc selection failed' }
          $admittedCargo = (& node -p 'require("node:fs").realpathSync(process.argv[1])' "$admittedCargo").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Cargo path required' }
          $admittedRustc = (& node -p 'require("node:fs").realpathSync(process.argv[1])' "$admittedRustc").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Canonical rustc path required' }
          if (-not $env:HOME) { $env:HOME = $env:USERPROFILE }
          if (-not $env:CARGO_HOME) { $env:CARGO_HOME = Join-Path $env:HOME '.cargo' }
          $env:CARGO_HOME = (Resolve-Path $env:CARGO_HOME).Path
          $env:RUSTUP_HOME = (& rustup show home).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Actual Rustup home observation failed' }
          python -B scripts/stability-gates/dependency_audit.py --root "$checkoutRoot" --node "$admittedNode" --output "$auditOutput" --cargo "$admittedCargo" --rustc "$admittedRustc"
          if ($LASTEXITCODE -ne 0) { throw 'Dependency gate failed; retained evidence is required for diagnosis' }
      - name: Retain raw advisory and SDK evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-${{ matrix.os }}
          path: ${{ runner.temp }}/zryna-dependency-security
          if-no-files-found: error
