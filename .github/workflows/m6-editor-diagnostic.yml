name: M6 editor tool target metadata diagnostic only
on:
  push:
    branches: [m6-editor-diagnostic-20261016]
permissions:
  contents: read
concurrency:
  group: m6-editor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-target-metadata:
    name: Original Windows git and tar target metadata only
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - name: Observe original PATH targets without executing either tool
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('m6-tool-metadata-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $env:M6_TOOL_METADATA_RESULT = Join-Path $root 'TARGET_METADATA.json'
          node m6-tool-target-metadata-diagnostic.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Metadata observation did not finish' }
      - name: Retain metadata only without host acceptance claims
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-windows-tool-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6-tool-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
