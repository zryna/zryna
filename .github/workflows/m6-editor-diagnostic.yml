name: M6 editor sandbox diagnostic only
on:
  push:
    branches: [m6-editor-diagnostic-20261016]
permissions:
  contents: read
concurrency:
  group: m6-editor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-offline:
    name: Windows current editor ownership controls
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: {version: 11.18.0}
      - run: pnpm install --frozen-lockfile
      - name: Run original offline controls on exact push revision
        shell: pwsh
        run: |
          $controlRoot = Join-Path $env:RUNNER_TEMP ('m6-owner-controls-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $controlRoot -ErrorAction Stop | Out-Null
          $env:ZRYNA_M6_EDITOR_CONTROL_RECORDS = $controlRoot
          node --test scripts/m6/installed-editor/controls.test.mjs scripts/m6/installed-editor/files.test.mjs scripts/m6/installed-editor/ownership.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic Windows editor controls failed' }
      - name: Retain original Windows owner observations without cleanup promotion
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-windows-owner-controls-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6-owner-controls-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
