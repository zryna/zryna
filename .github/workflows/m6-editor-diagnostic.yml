name: M6 owned Windows VSIX installation diagnostic only
on:
  push:
    branches: [m6-editor-diagnostic-20261016]
permissions:
  contents: read
concurrency:
  group: m6-editor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-owned-vsix:
    name: Original owned canonical VSIX install and strict inventory
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: {version: 11.18.0}
      - run: pnpm install --frozen-lockfile
      - name: One protected official extraction and current-source VSIX installation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP ('m6-owned-vsix-{0}-{1}' -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $env:M6_VSIX_DIAGNOSTIC_ROOT = $root
          node m6-owned-vsix-diagnostic.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Owned VSIX diagnostic did not pass' }
      - name: Retain actual inventory and raw package before strict-validator admission
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-windows-owned-vsix-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/*.raw
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/*.vsix
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/commands
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/material/EDITOR_ARCHIVE.json
            ${{ runner.temp }}/m6-owned-vsix-${{ github.run_id }}-${{ github.run_attempt }}/material/official-editor-download.*
          if-no-files-found: warn
          retention-days: 14
