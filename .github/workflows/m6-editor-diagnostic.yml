name: M6 editor sandbox diagnostic only
on:
  push:
    branches: [m6-editor-diagnostic-20261016]
permissions:
  contents: read
concurrency:
  group: m6-editor-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-offline:
    name: Windows current editor ownership controls
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: {version: 11.18.0}
      - run: pnpm install --frozen-lockfile
      - name: Run original offline controls on exact push revision
        shell: pwsh
        run: |
          node --test scripts/m6/installed-editor/controls.test.mjs scripts/m6/installed-editor/files.test.mjs scripts/m6/installed-editor/ownership.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic Windows editor controls failed' }
  linux-scoped-userns:
    name: Ubuntu exact Code scoped userns startup diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: {version: 11.18.0}
      - run: pnpm install --frozen-lockfile
      - name: Authenticate complete official Code archive and prepare exact source
        shell: bash
        run: |
          diagnostic_root="$RUNNER_TEMP/m6-editor-diag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$diagnostic_root"
          node scripts/m6/installed-editor-acquire.mjs "$diagnostic_root/material"
          node scripts/m6/installed-editor/diagnostic-prepare.mjs "$diagnostic_root"
      - name: One executable scoped profile and standard bounded nonroot service
        shell: bash
        run: |
          diagnostic_root="$RUNNER_TEMP/m6-editor-diag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo -n /usr/bin/python3 -I -B scripts/m6/installed-editor/diagnostic-root.py "$diagnostic_root"
      - name: Retain diagnostic metadata and bounded original owner logs only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-editor-scoped-userns-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/CONFIG.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/PREPARED.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/ROOT_RESULT.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/PROBE_STARTED.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/GUI_READY.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/PROBE_RESULT.json
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/SERVICE.*
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/stage/probe
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/preparation
            ${{ runner.temp }}/m6-editor-diag-${{ github.run_id }}-${{ github.run_attempt }}/material/EDITOR_ARCHIVE.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
