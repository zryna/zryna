name: M6 early installed editor integration diagnostic
on:
  push:
    branches: [m6-editor-diagnostic-20261016]
permissions:
  contents: read
  actions: read
concurrency:
  group: m6-editor-full-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable-setup:
    name: early portable setup diagnostic
    permissions:
      contents: read
    uses: ./.github/workflows/portable-setup.yml
  m6-installed-editor:
    name: early installed editor diagnostic
    needs: portable-setup
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/m6-installed-editor.yml
