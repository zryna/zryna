name: Bounded Windows job-counter diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-counter-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 71fd69d99a39c22bdf262d1655a032aa76221f3e
          path: product
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
      - name: Bind clean source and passed portable handoff; prepare diagnostic copy
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node operator/operator/windows-job-counter/prepare.mjs "$env:GITHUB_WORKSPACE/product" "$env:RUNNER_TEMP/m6-windows-counter"
          if ($LASTEXITCODE) { throw 'Diagnostic preparation failed' }
      - name: One bounded native private-job churn first
        shell: pwsh
        run: |
          & pwsh -NoLogo -NoProfile -NonInteractive -File operator/operator/windows-job-counter/churn.ps1 -Root $env:M6_DIAG_ROOT
          if ($LASTEXITCODE) { throw 'Native counter failure captured; no editor retry' }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
        working-directory: product
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          artifact-ids: 12151852650
          run-id: 39164226628
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/m6-editor-handoff
          merge-multiple: true
      - name: Original pinned official editor acquisition
        working-directory: product
        shell: pwsh
        run: |
          node scripts/m6/installed-editor-acquire.mjs "$env:RUNNER_TEMP/m6-editor-material"
          if ($LASTEXITCODE) { throw 'Original pinned editor acquisition failed' }
      - name: One original installed-editor command with disclosed diagnostic copy overlay
        working-directory: product
        shell: pwsh
        run: |
          $receipt = Get-Content -LiteralPath "$env:RUNNER_TEMP/m6-editor-handoff/candidate-receipt.json" -Raw | ConvertFrom-Json
          foreach ($pin in @($receipt.archive.sha256,$receipt.manifestSha256,$receipt.serverSha256,$receipt.vsixSha256)) {
            if ($pin -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid authenticated handoff pin' }
          }
          $preload = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE/operator/operator/windows-job-counter/preload.mjs")
          $preloadUri = ([Uri]$preload).AbsoluteUri
          node --import $preloadUri scripts/m6/installed-editor.mjs `
            --handoff "$env:RUNNER_TEMP/m6-editor-handoff" `
            --editor-archive "$env:RUNNER_TEMP/m6-editor-material/editor.zip" `
            --source-commit 71fd69d99a39c22bdf262d1655a032aa76221f3e `
            --source-tree 351da60bd4037e0f96c286045c8943f41fa99b03 `
            --source-epoch $env:M6_SOURCE_EPOCH `
            --setup-archive-sha256 $receipt.archive.sha256 --setup-manifest-sha256 $receipt.manifestSha256 `
            --server-sha256 $receipt.serverSha256 --vsix-sha256 $receipt.vsixSha256 --output $env:M6_DIAG_OUTPUT
          if ($LASTEXITCODE) { throw 'Original diagnostic editor flow failed; counters retained' }
      - name: Preserve complete diagnostic results and negative receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-windows-job-counter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-windows-counter
            ${{ runner.temp }}/m6-editor-material/EDITOR_ARCHIVE.json
            ${{ runner.temp }}/m6-editor-material/official-editor-download.*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
