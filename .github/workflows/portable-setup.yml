name: Focused DNS TLS transport diagnostic
on:
  workflow_dispatch:
    inputs:
      operator_commit:
        description: Exact independently reviewed diagnostic operator commit
        required: true
      diagnostic_sha256:
        description: Exact independently reviewed diagnose.py SHA256
        required: true
permissions:
  contents: read
jobs:
  transport-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: diagnostic-operator
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d73f616082749dab3d18e5be04c96650086e9be7
          path: reviewed-seed-carrier
          persist-credentials: false
      - name: Diagnose exactly original provided DNS and verifying TLS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTED_OPERATOR: ${{ inputs.operator_commit }}
          SELECTED_DIAGNOSTIC: ${{ inputs.diagnostic_sha256 }}
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_TOKEN,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,SELECTED_OPERATOR,SELECTED_DIAGNOSTIC /usr/bin/python3 -I -B - "$GITHUB_WORKSPACE/diagnostic-operator" "$GITHUB_WORKSPACE/reviewed-seed-carrier" <<'PY'
          import hashlib,os,pathlib,re,subprocess,sys
          operator,baseline=map(pathlib.Path,sys.argv[1:]);head=os.environ['GITHUB_SHA'];expected=os.environ['SELECTED_DIAGNOSTIC']
          assert re.fullmatch('[a-f0-9]{40}',head) and head==os.environ['SELECTED_OPERATOR'] and re.fullmatch('[a-f0-9]{64}',expected)
          env={'PATH':'/usr/bin:/bin','HOME':'/nonexistent','LC_ALL':'C','GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_NO_REPLACE_OBJECTS':'1'}
          raw=subprocess.check_output(['/usr/bin/git','-c','safe.directory='+str(operator),'--no-replace-objects','-C',str(operator),'show',head+':operator/dns-tls/diagnose.py'],env=env,timeout=10)
          assert hashlib.sha256(raw).hexdigest()==expected
          for folder in ['/workspace','/workspace/scratch']:
              p=pathlib.Path(folder);p.mkdir(mode=0o755,exist_ok=True);assert p.resolve()==p and p.stat().st_uid==0 and not p.stat().st_mode&0o022
          run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'];assert re.fullmatch('[1-9][0-9]*',run) and attempt=='1'
          target=pathlib.Path('/workspace/scratch/M6_410_DNS_TLS_BOOTSTRAP_'+run+'_'+attempt+'.py')
          with target.open('xb') as f:f.write(raw)
          target.chmod(0o400)
          os.execv('/usr/bin/python3',['/usr/bin/python3','-I','-B',str(target),'bootstrap',str(operator),str(baseline),expected])
          PY
      - name: Make owned diagnostic evidence readable for retention
        if: always()
        shell: bash
        run: |
          sudo -n --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT /usr/bin/python3 -I -B - <<'PY'
          import os,pathlib,re
          run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'];assert re.fullmatch('[1-9][0-9]*',run) and attempt=='1'
          root=pathlib.Path('/workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_'+run+'_'+attempt)
          if root.exists():
              for p in [root,*root.rglob('*')]:
                  assert not p.is_symlink() and p.stat().st_uid==(65534 if p==root/'namespace-run' else 0)
                  p.chmod(0o755 if p.is_dir() else (0o555 if p.stat().st_mode&0o111 else 0o444))
          PY
      - name: Retain whole diagnostic observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-dns-tls-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.json
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.py
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.stdout
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.stderr
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.mountinfo
            /workspace/scratch/M6_410_DNS_TLS_DIAGNOSTIC_${{ github.run_id }}_${{ github.run_attempt }}/*.conf
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
