name: M6 one fixed readonly-proc AppArmor exec diagnostic
on:
  workflow_dispatch:
    inputs:
      operator_commit:
        description: Exact independently reviewed operator commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      M6_HOST_PROBE_ROOT: /tmp/m6-readonly-proc-${{ github.run_id }}-${{ github.run_attempt }}
      APPROVED_OPERATOR: ${{ inputs.operator_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact reviewed operator, then one separate Engine diagnostic
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_OPERATOR" =~ ^[a-f0-9]{40}$ ]]
          test "$APPROVED_OPERATOR" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo -n /usr/bin/python3 -I -B operator/host_probe.py "$M6_HOST_PROBE_ROOT" "$GITHUB_WORKSPACE"
      - name: Retain whole actual responses and owned cleanup, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-readonly-proc-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.M6_HOST_PROBE_ROOT }}/*.json
            ${{ env.M6_HOST_PROBE_ROOT }}/*.stdout
            ${{ env.M6_HOST_PROBE_ROOT }}/*.stderr
            ${{ env.M6_HOST_PROBE_ROOT }}/*.log
            ${{ env.M6_HOST_PROBE_ROOT }}/caller__*.bin
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
