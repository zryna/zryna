name: Portable setup candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: reproduce portable setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm editor:check
      - run: node --test tests/portable-vsix.test.mjs
      - name: Bind verifier
        shell: pwsh
        run: '"ZRYNA_COSIGN=$((Get-Command cosign).Source)" >> $env:GITHUB_ENV'
      - name: Build independent server replicas and verify nested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/portable-setup/ci.mjs "${{ runner.temp }}/portable-evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-setup-${{ matrix.os }}
          path: ${{ runner.temp }}/portable-evidence/handoff
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  accept:
    name: fresh portable acceptance (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: portable-setup-${{ matrix.os }}
          path: ${{ runner.temp }}/candidate
      - name: Verify exact build artifact and exercise a relocated install
        shell: pwsh
        run: |
          $inputRoot = '${{ runner.temp }}/candidate'
          $receipt = Get-Content -LiteralPath "$inputRoot/candidate-receipt.json" -Raw | ConvertFrom-Json
          $archive = Join-Path $inputRoot $receipt.archive.filename
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $receipt.archive.sha256) { throw 'Archive identity differs' }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive -DestinationPath "$inputRoot/extracted" }
          else { New-Item -ItemType Directory -Path "$inputRoot/extracted" | Out-Null; tar -xzf $archive -C "$inputRoot/extracted"; if ($LASTEXITCODE) { throw 'Extraction failed' } }
          $installation = (Get-ChildItem -LiteralPath "$inputRoot/extracted" -Directory).FullName
          $runtime = if ($IsWindows) { "$installation/compiler/runtime/node/node.exe" } else { "$installation/compiler/runtime/node/bin/node" }
          $harnessRuntime = if ($IsWindows) { "$inputRoot/acceptance-node.exe" } else { "$inputRoot/acceptance-node" }
          Copy-Item -LiteralPath $runtime -Destination $harnessRuntime
          if (-not $IsWindows) { chmod 755 $harnessRuntime }
          & $harnessRuntime scripts/portable-setup/accept.mjs --installation $installation --digest $receipt.manifestSha256 --work '${{ runner.temp }}/portable-acceptance'
          if ($LASTEXITCODE) { throw 'Acceptance failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-acceptance-${{ matrix.os }}
          path: ${{ runner.temp }}/portable-acceptance/acceptance.json
          if-no-files-found: error
          retention-days: 14
