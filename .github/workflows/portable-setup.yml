name: Bounded remote public runtime
on:
  workflow_dispatch:
    inputs:
      operator_commit:
        description: Independently reviewed exact operator commit
        required: true
      stage_sha256:
        description: Independently reviewed stage.py SHA256
        required: true
      bundle_sha256:
        description: Independently reviewed closed bundle.json SHA256
        required: true
      source_commit:
        description: Actual frozen product source commit
        required: true
      source_tree:
        description: Actual frozen product source tree
        required: true
      candidate_review_sha256:
        description: Actual independently selected two-replica candidate review SHA256
        required: true
      compiler_sha256:
        description: Actual whole candidate compiler SHA256
        required: true
      publication_selection_sha256:
        description: Actual independently reviewed original .3 six-input selection SHA256
        required: true
      documentation_selection_sha256:
        description: Actual same-source documentation selection SHA256
        required: true
permissions:
  contents: read
jobs:
  remote-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: operator-checkout
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          path: product-checkout
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Authenticate and stage one rooted operator
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTED_OPERATOR: ${{ inputs.operator_commit }}
          SELECTED_STAGE_SHA256: ${{ inputs.stage_sha256 }}
          SELECTED_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          SELECTED_SOURCE: ${{ inputs.source_commit }}
          SELECTED_TREE: ${{ inputs.source_tree }}
          SELECTED_REVIEW: ${{ inputs.candidate_review_sha256 }}
          SELECTED_COMPILER: ${{ inputs.compiler_sha256 }}
          SELECTED_PUBLICATION: ${{ inputs.publication_selection_sha256 }}
          SELECTED_DOCUMENTATION: ${{ inputs.documentation_selection_sha256 }}
        run: |
          set -euo pipefail
          export SELECTED_NODE
          SELECTED_NODE="$(command -v node)"
          /usr/bin/python3 - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'m6-bootstrap.intent.json'
          with p.open('x')as f:json.dump({'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'command':'sudo root Python: authenticate selected Git stage blob, stage inputs, start one host owner','operator':os.environ['SELECTED_OPERATOR'],'source':os.environ['SELECTED_SOURCE'],'tree':os.environ['SELECTED_TREE'],'bundleSha256':os.environ['SELECTED_BUNDLE_SHA256'],'candidateReviewSha256':os.environ['SELECTED_REVIEW'],'compilerSha256':os.environ['SELECTED_COMPILER'],'publicationSelectionSha256':os.environ['SELECTED_PUBLICATION'],'documentationSelectionSha256':os.environ['SELECTED_DOCUMENTATION']},f)
          PY
          set +e
          sudo -n --preserve-env=GITHUB_TOKEN,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,SELECTED_OPERATOR,SELECTED_STAGE_SHA256,SELECTED_BUNDLE_SHA256,SELECTED_SOURCE,SELECTED_TREE,SELECTED_REVIEW,SELECTED_COMPILER,SELECTED_NODE,SELECTED_PUBLICATION,SELECTED_DOCUMENTATION /usr/bin/python3 -I -B - "$GITHUB_WORKSPACE/operator-checkout" "$GITHUB_WORKSPACE/product-checkout" >"$RUNNER_TEMP/m6-bootstrap.stdout" 2>"$RUNNER_TEMP/m6-bootstrap.stderr" <<'PY'
          import hashlib,os,pathlib,re,subprocess,sys
          operator,source=sys.argv[1:]; commit=os.environ['SELECTED_OPERATOR']; expected=os.environ['SELECTED_STAGE_SHA256']
          assert re.fullmatch('[a-f0-9]{40}',commit) and re.fullmatch('[a-f0-9]{64}',expected) and commit==os.environ['GITHUB_SHA']
          env={'PATH':'/usr/bin:/bin','HOME':'/nonexistent','LC_ALL':'C','GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':'/dev/null','GIT_NO_REPLACE_OBJECTS':'1'}
          command=['/usr/bin/git','-c','safe.directory='+operator,'--no-replace-objects','-C',operator]
          assert subprocess.run(command+['rev-parse','HEAD'],env=env,capture_output=True,check=True,timeout=10).stdout.decode().strip()==commit
          raw=subprocess.run(command+['show',commit+':operator/remote-public-runtime/stage.py'],env=env,capture_output=True,check=True,timeout=10).stdout
          assert hashlib.sha256(raw).hexdigest()==expected
          for value in ['/workspace','/workspace/scratch']:
              p=pathlib.Path(value);p.mkdir(mode=0o755,exist_ok=True);assert p.resolve()==p and p.stat().st_uid==0 and not p.stat().st_mode&0o022
          run,attempt=os.environ['GITHUB_RUN_ID'],os.environ['GITHUB_RUN_ATTEMPT'];assert re.fullmatch('[1-9][0-9]*',run) and re.fullmatch('[1-9][0-9]*',attempt)
          path=pathlib.Path('/workspace/scratch/M6_410_PUBLIC_BOOTSTRAP_'+run+'_'+attempt+'.py')
          with path.open('xb')as f:f.write(raw)
          path.chmod(0o444)
          argv=[str(path),'bootstrap',operator,source,commit,os.environ['SELECTED_BUNDLE_SHA256'],os.environ['SELECTED_SOURCE'],os.environ['SELECTED_TREE'],os.environ['SELECTED_REVIEW'],os.environ['SELECTED_COMPILER'],os.environ['SELECTED_NODE'],os.environ['SELECTED_PUBLICATION'],os.environ['SELECTED_DOCUMENTATION']]
          os.execv('/usr/bin/python3',['/usr/bin/python3','-I','-B',*argv])
          PY
          bootstrap_exit=$?
          export BOOTSTRAP_EXIT="$bootstrap_exit"
          /usr/bin/python3 - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'m6-bootstrap.complete.json'
          with p.open('x')as f:json.dump({'finishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'exitCode':int(os.environ['BOOTSTRAP_EXIT'])},f)
          PY
          exit "$bootstrap_exit"
      - name: Wait for completed preparation capture
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path('/workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_'+os.environ['GITHUB_RUN_ID']+'_'+os.environ['GITHUB_RUN_ATTEMPT']);until=time.monotonic()+3000
          while not (root/'MID_READY.json').exists():
              if (root/'COMPLETE.json').exists():raise RuntimeError('Host completed before preparation artifact; inspect retained failure')
              owner=json.loads((root/'OWNER_STARTED.json').read_bytes());proc=pathlib.Path('/proc/'+str(owner['pid'])+'/stat')
              if not proc.exists() or proc.read_text().rsplit(')',1)[1].split()[19]!=owner['epoch']:raise RuntimeError('Original host owner exited; inspect retained owner streams')
              if time.monotonic()>=until:raise TimeoutError('Finite preparation artifact wait')
              time.sleep(1)
          ready=json.loads((root/'MID_READY.json').read_bytes());assert ready['approval']is False
          print(json.dumps(ready))
          PY
      - name: Retain preparation for independent protected-tag review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-remote-public-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/mid-artifact
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
      - name: Wait for the same owned host actual exit
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import datetime,json,os,pathlib,time
          root=pathlib.Path('/workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_'+os.environ['GITHUB_RUN_ID']+'_'+os.environ['GITHUB_RUN_ATTEMPT'])
          if not (root/'OWNER_STARTED.json').exists():raise RuntimeError('No host owner was started; inspect bootstrap failure')
          started=datetime.datetime.fromisoformat(json.loads((root/'OWNER_STARTED.json').read_bytes())['startedAt']).timestamp();deadline=started+10560
          while not (root/'COMPLETE.json').exists():
              owner=json.loads((root/'OWNER_STARTED.json').read_bytes());proc=pathlib.Path('/proc/'+str(owner['pid'])+'/stat')
              if not proc.exists() or proc.read_text().rsplit(')',1)[1].split()[19]!=owner['epoch']:raise RuntimeError('Original host owner exited without completion; inspect retained streams')
              if time.time()>=deadline:raise TimeoutError('Finite whole owned host wait')
              time.sleep(1)
          result=json.loads((root/'COMPLETE.json').read_bytes());print(json.dumps(result))
          assert result.get('returncode')==0 and not result.get('failure') and not result.get('captureFailure'),'Actual host/capture failed; retained originals are negative evidence'
          PY
      - name: Retain whole final raw evidence and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-remote-public-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/final-artifact
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/owner.stdout
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/owner.stderr
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/OWNER_STARTED.json
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/STAGED.json
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/COMPLETE.json
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/manifest.json
            /workspace/scratch/M6_410_REMOTE_PUBLIC_OPERATOR_${{ github.run_id }}_${{ github.run_attempt }}/context.json
            ${{ runner.temp }}/m6-bootstrap.intent.json
            ${{ runner.temp }}/m6-bootstrap.stdout
            ${{ runner.temp }}/m6-bootstrap.stderr
            ${{ runner.temp }}/m6-bootstrap.complete.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14

      - name: Retain separate inert runtime materials and partial exports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-remote-public-materials-${{ github.run_id }}-${{ github.run_attempt }}
          path: /workspace/scratch/M6_410_EPHEMERAL_HOST_${{ github.run_id }}_${{ github.run_attempt }}/material-capture
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
