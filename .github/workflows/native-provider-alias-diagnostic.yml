name: One-shot Windows native alias observation

on:
  push:
    branches: [codex/414-windows-alias-diagnostic-20261020]

permissions:
  contents: read

concurrency:
  group: native-provider-alias-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  observe:
    name: Windows native alias observation only
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout actual operator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Bind original controlled builder and operator identity
        shell: pwsh
        run: |
          $attempt = Join-Path $env:RUNNER_TEMP 'native-provider-install-attempt'
          New-Item -ItemType Directory -Path $attempt -ErrorAction Stop | Out-Null
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) { throw 'Operator checkout differs' }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Operator checkout is dirty' }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME '.rustup' }
          "CARGO_HOME=$((Resolve-Path -LiteralPath $cargoHome).Path)" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$((Resolve-Path -LiteralPath $rustupHome).Path)" >> $env:GITHUB_ENV
          git show --no-patch --format=fuller HEAD > (Join-Path $attempt 'operator-source.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Operator source evidence failed' }
          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          if (-not $?) { throw 'Visual Studio developer environment failed' }
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV
          "LIBPATH=$env:LIBPATH" >> $env:GITHUB_ENV
      - name: Fetch exact original locked Rust inputs
        run: cargo fetch --locked
      - name: Run the original producer once without changing admission
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-provider-install-attempt/qualification'
          node scripts/distribution/produce-native-installation.mjs --source "$env:GITHUB_WORKSPACE" --output "$output" --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Original producer failed; retain failure unchanged and observe aliases only' }
      - name: Observe actual aliases after the original producer
        if: always()
        shell: pwsh
        run: |
          $attempt = Join-Path $env:RUNNER_TEMP 'native-provider-install-attempt'
          node scripts/distribution/observe-native-producer-aliases.mjs --source "$env:GITHUB_WORKSPACE" --qualification "$attempt/qualification" --output "$attempt/windows-alias-observation.json"
          if ($LASTEXITCODE -ne 0) { throw 'Read-only alias observation failed; retain original evidence' }
      - name: Preserve original failures and bounded alias observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-alias-diagnostic-windows-2022-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-provider-install-attempt/operator-source.txt
            ${{ runner.temp }}/native-provider-install-attempt/windows-alias-observation.json
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.json
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.tar.gz
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.zip
            ${{ runner.temp }}/native-provider-install-attempt/qualification/producer-commands/**
            ${{ runner.temp }}/native-provider-install-attempt/qualification/smoke-commands/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
