name: Current native installation qualification

on:
  pull_request:
    paths:
      - '.github/workflows/native-provider-install.yml'
      - 'apps/zryna/**'
      - 'crates/**'
      - 'scripts/distribution/**'
      - 'scripts/distribution-release/**'
      - 'tests/native-distribution-v2.test.mjs'
      - 'tests/native-provider-public-install/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'zryna.workspace.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-provider-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: native installation (${{ matrix.os }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the actual candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Bind clean source and controlled Rust homes
        shell: pwsh
        env:
          EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $attempt = Join-Path $env:RUNNER_TEMP 'native-provider-install-attempt'
          New-Item -ItemType Directory -Path $attempt -ErrorAction Stop | Out-Null
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_CANDIDATE) { throw 'Candidate checkout differs' }
          $dirty = git status --porcelain=v1 --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Candidate checkout is dirty' }
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $HOME '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $HOME '.rustup' }
          "CARGO_HOME=$((Resolve-Path -LiteralPath $cargoHome).Path)" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$((Resolve-Path -LiteralPath $rustupHome).Path)" >> $env:GITHUB_ENV
          git show --no-patch --format=fuller HEAD > (Join-Path $attempt 'candidate.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate evidence failed' }
      - name: Bind the original Windows developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          if (-not $?) { throw 'Visual Studio developer environment failed' }
          "PATH=$env:PATH" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV
          "LIBPATH=$env:LIBPATH" >> $env:GITHUB_ENV
      - name: Fetch exact locked Rust dependencies
        run: cargo fetch --locked
      - name: Validate native content and failure boundaries
        run: node --test tests/native-distribution-v2.test.mjs tests/native-provider-public-install/producer.test.mjs tests/native-provider-public-install/source-ref.test.mjs tests/native-provider-public-install/workflow.test.mjs tests/native-provider-public-install/command-h1.test.mjs tests/native-provider-public-install/capture.test.mjs
      - name: Build twice and qualify the actual relocated native installation
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'native-provider-install-attempt/qualification'
          node scripts/distribution/produce-native-installation.mjs --source "$env:GITHUB_WORKSPACE" --output "$output" --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'Actual native installation qualification failed; retain original evidence' }
      - name: Preserve actual archives, commands and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-provider-install-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/native-provider-install-attempt/candidate.txt
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.json
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.tar.gz
            ${{ runner.temp }}/native-provider-install-attempt/qualification/*.zip
            ${{ runner.temp }}/native-provider-install-attempt/qualification/producer-commands/**
            ${{ runner.temp }}/native-provider-install-attempt/qualification/smoke-commands/**
            ${{ runner.temp }}/native-provider-install-attempt/qualification/ordinary-projects/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
