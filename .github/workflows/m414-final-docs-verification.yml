# TEMPLATE: external pins below must come from the authenticated preparation and actual docs run.
name: Issue 414 final documentation verification
on:
  push:
    branches: [codex/414-final-main4-docs-verification-20261022]
permissions:
  contents: read
  actions: read
  checks: read
jobs:
  verify:
    name: verify exact-main documentation and independent raw bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operator
          persist-credentials: false
      - name: Stage the reviewed final verifier
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0600 operator/scripts/m4/m414-final-docs-verification.mjs "$RUNNER_TEMP/m414-final-operator/verify.mjs"
          printf '%s  %s\n' '686c60c88f8c2301bbe0c90c9b748f03921cc8f80dcb4d0b7b3872d3e3ae98f7' "$RUNNER_TEMP/m414-final-operator/verify.mjs" | sha256sum --check --status
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 01c81f4087982b2f1c99c85f9a7c0360dbeb0e28
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Select the genuine source main branch
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          git switch --force-create main 01c81f4087982b2f1c99c85f9a7c0360dbeb0e28
          test "$(git rev-parse HEAD)" = 01c81f4087982b2f1c99c85f9a7c0360dbeb0e28
          test "$(git symbolic-ref HEAD)" = refs/heads/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.18.0
          package_json_file: source/package.json
      - name: Install exact-source frozen dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Run the unchanged original final docs gate and independent export
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          M414_HOSTED_EXPECTATIONS_SHA256: '66ae4524b05a670bb32c0b2c3630fb23f6df52fcead0bce36f3ac444336226d3'
          M414_HOSTED_EXPECTATIONS_BASE64: ''
          M414_DOCS_MANIFEST_SHA256: 'f1c4e2a1baaef84ecfe472a7d9b830ad49d5b1eb535e99fca6143a0e636abf30'
          M414_REGISTRY_SHA256: '3074da92e0ff93ee67343184cfb1b8d79c1ad33e1ec31bc2d5efbd6661e05843'
          M414_MATRIX_SHA256: '0190d822870d0965dd68417da51c777efb29fee66f30eb0b94d0c2c0cf092942'
          M414_DOCS_WORKFLOW_SHA256: '0545f410fe47c72a964b6333dd2f6e8f2cf57b7a315a9b0afc3737640cb0e18a'
          M414_DOCS_RUN_ID: '39851700097'
          M414_DOCS_ATTEMPT: '1'
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/m414-final-operator/verify.mjs" \
            --source-root "$GITHUB_WORKSPACE/source" \
            --output "$RUNNER_TEMP/m414-final-verification"
      - name: Retain original results and bounded independent review material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m414-main4-final-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m414-final-verification/review/**
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
