name: M6 reviewed final exact-source evidence transport
on:
  workflow_dispatch:
    inputs:
      operator_commit: {description: Exact independently reviewed final operator commit, required: true, type: string}
      manifest_sha256: {description: Exact independently reviewed canonical payload selection SHA256, required: true, type: string}
      review_sha256: {description: Exact independently reviewed actual payload review SHA256, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: m6-410-final-evidence-publication
  cancel-in-progress: false
jobs:
  publish-reviewed-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - name: Validate actual final payload, upload once, publish once and read back
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
          APPROVED_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          APPROVED_REVIEW_SHA256: ${{ inputs.review_sha256 }}
        run: node operator/final-evidence-upload.mjs
      - name: Preserve complete actual transport and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-final-evidence-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6-final-evidence
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
