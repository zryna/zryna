name: Private draft read visibility diagnostic
on:
  workflow_dispatch:
    inputs:
      operator_commit:
        description: Exact approved read-only diagnostic operator revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: m6-410-private-draft-read-diagnostic
  cancel-in-progress: false
jobs:
  probe-draft-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.22.1
      - name: Observe the fixed private draft using only official read-only token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
        run: node operator/private-draft-read.mjs
      - name: Retain sanitized diagnostic result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-private-draft-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6-private-draft-read/RESULT.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
