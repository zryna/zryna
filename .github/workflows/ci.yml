name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      structure_base:
        description: Full trusted ancestor commit for repository structure validation
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZRYNA_STRUCTURE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.structure_base }}

jobs:
  portable-setup:
    name: portable setup
    needs: [route-contracts, m0]
    if: needs.route-contracts.outputs.distribution_release == 'true'
    uses: ./.github/workflows/portable-setup.yml

  m6-installed-editor:
    name: m6 installed editor
    needs: [route-contracts, portable-setup]
    if: needs.route-contracts.outputs.distribution_release == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/m6-installed-editor.yml

  fast-contracts:
    name: fast contract checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run portable preflight contracts
        run: node scripts/run-preflight.mjs --fast-contracts

  route-contracts:
    name: route contract checks
    runs-on: ubuntu-latest
    outputs:
      diagnostics: ${{ steps.routes.outputs.diagnostics }}
      distribution_release: ${{ steps.routes.outputs.distribution_release }}
      package_release: ${{ steps.routes.outputs.package_release }}
      provider_v4: ${{ steps.routes.outputs.provider_v4 }}
      wit: ${{ steps.routes.outputs.wit }}
      m4: ${{ steps.routes.outputs.m4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Classify changed paths
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL_VALIDATION" = true ]; then
            node scripts/classify-workflow-paths.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-workflow-paths.mjs \
              --git-diff "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  owned-data-quick:
    name: owned data quick (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M3 owned-data semantics
        run: pnpm m3:owned:quick

  preflight:
    name: preflight
    # #369: cold execution reached the 15-minute deadline after bootstrap completed.
    # Five minutes beyond the 10/25-minute steps includes bounded SQLite setup.
    timeout-minutes: 40
    runs-on: ubuntu-latest
    # Keep cold builds within the execution budget without changing test checks.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Prepare isolated npm timing directory
        run: node scripts/collect-npm-timing.mjs prepare
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 10
        with:
          version: 11.18.0
        env:
          npm_config_timing: 'true'
          npm_config_logs_dir: ${{ runner.temp }}/zryna-npm-bootstrap-timing
      - name: Collect numeric npm bootstrap timing
        if: ${{ !cancelled() }}
        run: node scripts/collect-npm-timing.mjs collect
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Prepare pinned SQLite source fixture
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -B scripts/m5/prepare_sqlite_fixture.py --output "$RUNNER_TEMP/zryna-sqlite-source"
          printf 'ZRYNA_SQLITE_FIXTURE_ROOT=%s\n' "$RUNNER_TEMP/zryna-sqlite-source" >> "$GITHUB_ENV"
      - run: node scripts/run-preflight.mjs --compiler-contracts
        timeout-minutes: 25
      - name: Capture ordinary sanitizer compiler prefix
        timeout-minutes: 5
        env:
          M5_PREFIX_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B -m unittest discover -s scripts/m5/tests -p 'test_*.py'
          python3 -B scripts/m5/collect_ordinary_sanitizer_prefix.py --output "$RUNNER_TEMP/m5-ordinary-sanitizer-prefix"
      - name: Upload ordinary sanitizer compiler prefix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-ordinary-sanitizer-prefix-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-ordinary-sanitizer-prefix
          if-no-files-found: error
          retention-days: 7
      - name: Execute reviewed ordinary sanitizer runtime
        timeout-minutes: 5
        env:
          M5_PREFIX_CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
          CARGO_BUILD_JOBS: '2'
          RUST_TEST_THREADS: '2'
          CARGO_INCREMENTAL: '0'
        run: python3 -B scripts/m5/collect_owned_sanitizer_runtime.py --output "$RUNNER_TEMP/m5-ordinary-sanitizer-runtime"
      - name: Upload reviewed ordinary sanitizer runtime
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-ordinary-sanitizer-runtime-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m5-ordinary-sanitizer-runtime
          if-no-files-found: error
          retention-days: 7

  rust:
    name: rust (${{ matrix.os }})
    # The complete cold Windows closure can exceed 30 minutes.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify native recipe policy hostile cases
        run: node scripts/run-native-recipe-tests.mjs
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M2 semantics
        run: cargo test --locked -p zryna-semantics --lib control_flow_v1
      - name: Prepare pinned SQLite source fixture
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -B scripts/m5/prepare_sqlite_fixture.py --output "$RUNNER_TEMP/zryna-sqlite-source"
          printf 'ZRYNA_SQLITE_FIXTURE_ROOT=%s\n' "$RUNNER_TEMP/zryna-sqlite-source" >> "$GITHUB_ENV"
      - name: Verify M2 driver security
        run: cargo test --locked -p zryna-driver --lib
      - name: Verify native source resource limits
        if: runner.os == 'Windows'
        run: node scripts/run-native-source-resource-tests.mjs
      - name: Verify exact Windows directory lifecycle
        if: runner.os == 'Windows'
        run: cargo test --locked -p zryna-windows-filesystem -- --show-output
      - name: Verify public M2 CLI profile
        run: cargo test --locked -p zryna --test cli control_flow_
      - name: Run Windows CLI smoke
        if: runner.os == 'Windows'
        run: cargo test --locked -p zryna --test cli javascript_build_and_run_publish_exact_bundles -- --exact
      - name: Verify restricted playground and M6 contracts
        run: |
          pnpm playground:contract
          pnpm m6:contract
      - name: Verify Linux playground helper units
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tests/playground-host-unit.py
          python3 tests/playground-cgroup-unit.py
          python3 tests/playground-join-unit.py
          python3 tests/playground-helper-policy-unit.py
          python3 -B examples/playground/restricted/daemon/preparation/test_preparation.py
          python3 -B -m unittest discover -s tests -p 'playground_operator*.py'
      - name: Verify Linux compiler publication boundaries
        if: runner.os == 'Linux'
        run: node --test --test-concurrency=1 scripts/m6/compiler-release/*.test.mjs
      - name: Verify Linux operator qualification contracts
        if: runner.os == 'Linux'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          node --test --test-concurrency=1 examples/playground/restricted/daemon/launcher*.test.mjs
          node --test --test-concurrency=1 examples/playground/restricted/daemon/cli-parity/*.test.mjs
          node --test --test-concurrency=1 examples/playground/restricted/daemon/ui-qualification/*.test.mjs
          python3 -B -m unittest discover -s examples/playground/restricted/daemon/cli-parity -p 'test_*.py'
          PYTHONPATH=examples/playground/restricted/daemon/preparation python3 -B -m unittest discover -s examples/playground/restricted/daemon/ui-qualification -p 'test_owner_*.py'
      - name: Verify documentation bundle contract
        run: pnpm docs:check
      - name: Verify and package editor client
        run: |
          pnpm editor:check
          pnpm editor:package
      - run: node scripts/run-m0-conformance.mjs

  adapter-platform:
    name: adapter (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify stability evidence validator hostile cases
        run: node scripts/stability-gates/check-tests.mjs
      - run: pnpm adapter:check
      - run: pnpm adapter:test
      - run: pnpm protocol:check
      - run: pnpm protocol:test

  adapter:
    name: adapter
    if: always()
    needs: [fast-contracts, preflight, adapter-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify adapter platforms
        env:
          FAST_CONTRACTS_RESULT: ${{ needs.fast-contracts.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PLATFORM_RESULT: ${{ needs.adapter-platform.result }}
        run: test "$FAST_CONTRACTS_RESULT" = success && test "$PREFLIGHT_RESULT" = success && test "$PLATFORM_RESULT" = success

  m2-platform:
    name: m2 (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm m2:check

  m2:
    name: m2
    if: always()
    needs: [m0, m2-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify M2 platforms
        env:
          M0_RESULT: ${{ needs.m0.result }}
          PLATFORM_RESULT: ${{ needs.m2-platform.result }}
        run: test "$M0_RESULT" = success && test "$PLATFORM_RESULT" = success

  m3-platform:
    name: m3 (${{ matrix.os }})
    # The complete cold Windows ownership and allocation matrix can exceed 30 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm m3:check
        env:
          CARGO_BUILD_JOBS: 3
          RUST_TEST_THREADS: 3

  m3:
    name: m3
    if: always()
    needs: [m0, m2, m3-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete M3 gate
        env:
          M0_RESULT: ${{ needs.m0.result }}
          M2_RESULT: ${{ needs.m2.result }}
          PLATFORM_RESULT: ${{ needs.m3-platform.result }}
        run: test "$M0_RESULT" = success && test "$M2_RESULT" = success && test "$PLATFORM_RESULT" = success

  m0:
    name: m0
    if: always()
    needs: [fast-contracts, owned-data-quick, preflight, rust, adapter, route-contracts, provider-conformance-v4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify complete M0 gate
        env:
          FAST_CONTRACTS_RESULT: ${{ needs.fast-contracts.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          OWNED_DATA_QUICK_RESULT: ${{ needs.owned-data-quick.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ADAPTER_RESULT: ${{ needs.adapter.result }}
          ROUTING_RESULT: ${{ needs.route-contracts.result }}
          PROVIDER_V4_REQUIRED: ${{ needs.route-contracts.outputs.provider_v4 }}
          PROVIDER_V4_RESULT: ${{ needs.provider-conformance-v4.result }}
        run: node scripts/verify-provider-v4-ci-result.mjs && test "$FAST_CONTRACTS_RESULT" = success && test "$OWNED_DATA_QUICK_RESULT" = success && test "$PREFLIGHT_RESULT" = success && test "$RUST_RESULT" = success && test "$ADAPTER_RESULT" = success && test "$ROUTING_RESULT" = success

  diagnostics-contract:
    name: Diagnostic protocol (${{ matrix.os }})
    if: needs.route-contracts.outputs.diagnostics == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm diagnostics:contract
      - run: cargo test --locked -p zryna-diagnostics
      - run: cargo clippy --locked -p zryna-diagnostics --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  package-release-contract:
    name: package release contract (${{ matrix.os }})
    if: needs.route-contracts.outputs.package_release == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:contract
      - run: pnpm build-plan:contract
      - run: cargo test --locked -p zryna-package

  distribution-release-contract:
    name: distribution release contract (${{ matrix.os }})
    if: needs.route-contracts.outputs.distribution_release == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:contract
      - run: pnpm distribution:check

  published-release-clean-host:
    name: published beta clean host (${{ matrix.target }})
    if: needs.route-contracts.outputs.distribution_release == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: pnpm install --frozen-lockfile
      - name: Acquire the exact immutable public release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .release/public | Out-Null
          gh api repos/zryna/zryna/releases/tags/v0.2.1 > .release/release-state.json
          gh release download v0.2.1 --repo zryna/zryna --dir .release/public
      - name: Verify and exercise the Linux release as an unprivileged user
        if: runner.os == 'Linux'
        shell: bash
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
        run: |
          mkdir -m 700 .release/linux-work .release/hostile-bin
          mkdir -m 700 release-evidence release-evidence/linux-output
          install -m 755 /bin/false .release/hostile-bin/zryna
          node_path="$(command -v node)"
          cosign_path="$(command -v cosign)"
          PATH="$(realpath .release/hostile-bin):/usr/bin:/bin" "$node_path" \
            scripts/distribution-release/run-published-acceptance.mjs \
            --cosign "$cosign_path" \
            --directory "$(realpath .release/public)" \
            --output "$(realpath release-evidence)/linux-output" \
            --state "$(realpath .release/release-state.json)" \
            --target "$ZRYNA_TARGET" \
            --work "$(realpath .release/linux-work)"
      - name: Verify and exercise the Windows release as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
        run: |
          $user = 'zryna423'
          $passwordText = "Zr423-$env:GITHUB_RUN_ATTEMPT!"
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $credential = [System.Management.Automation.PSCredential]::new(".\$user", $securePassword)
          $releaseRoot = (Resolve-Path .release/public).Path
          $statePath = (Resolve-Path .release/release-state.json).Path
          $releaseParent = (Resolve-Path .release).Path
          $userRoot = Join-Path $releaseParent 'windows-work'
          $workRoot = Join-Path $userRoot 'work'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'release-evidence'
          $outputRoot = Join-Path $evidenceRoot 'windows-output'
          $stdout = Join-Path $userRoot 'stdout.txt'
          $stderr = Join-Path $userRoot 'stderr.txt'
          $nodeSource = (Get-Command node).Source
          $cosignSource = (Get-Command cosign).Source
          net user $user $passwordText /add /passwordchg:no
          if ($LASTEXITCODE -ne 0) { throw 'could not create the standard test user' }
          try {
            New-Item -ItemType Directory -Path $workRoot -Force | Out-Null
            New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
            $node = Join-Path $userRoot 'node.exe'
            $cosign = Join-Path $userRoot 'cosign.exe'
            Copy-Item -LiteralPath $nodeSource -Destination $node
            Copy-Item -LiteralPath $cosignSource -Destination $cosign
            $hostile = Join-Path $userRoot 'hostile-bin'
            New-Item -ItemType Directory -Path $hostile | Out-Null
            Copy-Item -LiteralPath "$env:SystemRoot\System32\cmd.exe" `
              -Destination (Join-Path $hostile 'zryna.exe')
            $env:PATH = "$hostile;$env:PATH"
            icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)RX" /T /Q | Out-Null
            icacls $userRoot /grant "${user}:(OI)(CI)M" /T /Q | Out-Null
            icacls $outputRoot /grant "${user}:(OI)(CI)M" /T /Q | Out-Null
            icacls $userRoot /setowner $user /T /Q | Out-Null
            icacls $outputRoot /setowner $user /T /Q | Out-Null
            $localAppData = Join-Path $userRoot 'AppData\Local'
            New-Item -ItemType Directory -Path $localAppData -Force | Out-Null
            icacls $localAppData /setowner $user /T /Q | Out-Null
            $env:HOME = $userRoot
            $env:USERPROFILE = $userRoot
            $env:LOCALAPPDATA = $localAppData
            $env:TEMP = $userRoot
            $env:TMP = $userRoot
            $arguments = @(
              'scripts/distribution-release/run-published-acceptance.mjs',
              '--cosign', $cosign,
              '--directory', $releaseRoot, '--output', $outputRoot,
              '--state', $statePath, '--target', $env:ZRYNA_TARGET, '--work', $workRoot
            )
            $process = Start-Process -FilePath $node -ArgumentList $arguments `
              -WorkingDirectory $env:GITHUB_WORKSPACE -Credential $credential -LoadUserProfile `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            Get-Content -LiteralPath $stdout
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $stderr
              throw "standard-user acceptance failed with exit $($process.ExitCode)"
            }
          } finally {
            net user $user /delete | Out-Null
          }
      - name: Upload exact clean-host receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-beta-clean-host-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/*-output/published-clean-host-acceptance.json
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 7

  provider-conformance-v4:
    name: Provider conformance v4 (${{ matrix.os }})
    if: needs.route-contracts.outputs.provider_v4 == 'true'
    needs: route-contracts
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 40 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm provider:conformance:v4
      - name: Verify native lexer production limits
        run: node scripts/run-native-lexer-resource-tests.mjs

  wit-capability-contract:
    name: WIT capability contract (${{ matrix.os }})
    if: needs.route-contracts.outputs.wit == 'true'
    needs: route-contracts
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wit:contract

  m4-platform:
    name: m4 (${{ matrix.os }})
    if: needs.route-contracts.outputs.m4 == 'true'
    needs: route-contracts
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      M4_WORKFLOW_PATH: .github/workflows/ci.yml
      M4_SOURCE_REF: ${{ github.head_ref && format('refs/heads/{0}', github.head_ref) || github.ref }}
      CARGO_BUILD_JOBS: 3
      RUST_TEST_THREADS: 3
    steps:
      - name: Checkout exact M4 candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Verify M4 registry and hostile evidence contracts
        run: pnpm m4:registry && pnpm m4:evidence:contract
      - name: Prepare pinned SQLite source fixture
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          python3 -B scripts/m5/prepare_sqlite_fixture.py --output "$RUNNER_TEMP/zryna-sqlite-source"
          printf 'ZRYNA_SQLITE_FIXTURE_ROOT=%s\n' "$RUNNER_TEMP/zryna-sqlite-source" >> "$GITHUB_ENV"
      - name: Execute complete M0 through M4 core matrix
        shell: pwsh
        run: |
          $candidate = '${{ github.event.pull_request.head.sha || github.sha }}'
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate tree observation failed' }
          $sourceRef = $env:M4_SOURCE_REF
          $context = Join-Path $env:RUNNER_TEMP 'm4-core-context.json'
          node scripts/m4/observe-context.mjs --lane core --output $context --job-name 'm4 (${{ matrix.os }})' --source-ref $sourceRef --expected-commit $candidate --expected-tree $tree
          if ($LASTEXITCODE -ne 0) { throw 'M4 host context failed' }
          node scripts/run-m4-conformance.mjs --lane core --evidence "$env:RUNNER_TEMP/m4-core-evidence" --expected-commit $candidate --expected-tree $tree --source-ref $sourceRef --context $context
          if ($LASTEXITCODE -ne 0) { throw 'M4 core conformance failed' }
      - name: Preserve M4 core receipt and complete execution logs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-core-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m4-core-evidence-retained/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Preserve failed M4 core diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-core-diagnostics-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m4-core-evidence/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  m4-browser:
    name: m4 browser
    if: needs.route-contracts.outputs.m4 == 'true'
    needs: route-contracts
    uses: ./.github/workflows/browser-conformance.yml

  m4-installed:
    name: m4 installed
    if: needs.route-contracts.outputs.m4 == 'true'
    needs: route-contracts
    uses: ./.github/workflows/installed-command-h1.yml

  m4:
    name: m4
    if: always()
    needs: [route-contracts, m3, m4-platform, m4-browser, m4-installed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify every required M4 host lane
        env:
          M4_REQUIRED: ${{ needs.route-contracts.outputs.m4 }}
          ROUTING_RESULT: ${{ needs.route-contracts.result }}
          M3_RESULT: ${{ needs.m3.result }}
          M4_CORE_RESULT: ${{ needs.m4-platform.result }}
          M4_BROWSER_RESULT: ${{ needs.m4-browser.result }}
          M4_INSTALLED_RESULT: ${{ needs.m4-installed.result }}
        run: node scripts/m4/verify-ci-result.mjs
