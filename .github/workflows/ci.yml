name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  owned-data-quick:
    name: owned data quick (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M3 owned-data semantics
        run: pnpm m3:owned:quick

  preflight:
    name: preflight
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm preflight

  rust:
    name: rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M2 semantics
        run: cargo test --locked -p zryna-semantics --lib control_flow_v1
      - name: Verify M2 driver security
        run: cargo test --locked -p zryna-driver --lib
      - name: Verify public M2 CLI profile
        run: cargo test --locked -p zryna --test cli control_flow_
      - name: Run Windows CLI smoke
        if: runner.os == 'Windows'
        run: cargo test --locked -p zryna --test cli javascript_build_and_run_publish_exact_bundles -- --exact
      - name: Verify documentation bundle contract
        run: pnpm docs:check
      - run: node scripts/run-m0-conformance.mjs

  adapter-platform:
    name: adapter (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm adapter:check
      - run: pnpm adapter:test
      - run: pnpm protocol:check
      - run: pnpm protocol:test

  adapter:
    name: adapter
    if: always()
    needs: [preflight, adapter-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify adapter platforms
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PLATFORM_RESULT: ${{ needs.adapter-platform.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$PLATFORM_RESULT" = success

  m2-platform:
    name: m2 (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm m2:check

  m2:
    name: m2
    if: always()
    needs: [m0, m2-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify M2 platforms
        env:
          M0_RESULT: ${{ needs.m0.result }}
          PLATFORM_RESULT: ${{ needs.m2-platform.result }}
        run: test "$M0_RESULT" = success && test "$PLATFORM_RESULT" = success

  docs-publish:
    name: documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: m2
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify documentation bundle contract
        run: pnpm docs:check
      - name: Export authenticated next documentation bundle
        id: docs-bundle
        run: |
          digest="$(node scripts/docs/export.mjs \
            --channel next \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --output .zryna/out/docs/next)"
          printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          echo "manifest-sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'Compiler commit: `%s`\nDocumentation manifest SHA-256: `%s`\n' \
            "${{ github.sha }}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated next documentation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zryna-docs-next-${{ github.sha }}-${{ steps.docs-bundle.outputs.manifest-sha256 }}
          path: .zryna/out/docs/next
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true

  m0:
    name: m0
    if: always()
    needs: [owned-data-quick, preflight, rust, adapter]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete M0 gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          OWNED_DATA_QUICK_RESULT: ${{ needs.owned-data-quick.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ADAPTER_RESULT: ${{ needs.adapter.result }}
        run: test "$OWNED_DATA_QUICK_RESULT" = success && test "$PREFLIGHT_RESULT" = success && test "$RUST_RESULT" = success && test "$ADAPTER_RESULT" = success
