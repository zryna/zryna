name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/run-m0-conformance.mjs

  adapter-platform:
    name: adapter (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm adapter:check
      - run: pnpm adapter:test
      - run: pnpm protocol:check
      - run: pnpm protocol:test

  adapter:
    name: adapter
    if: always()
    needs: adapter-platform
    runs-on: ubuntu-latest
    steps:
      - name: Verify adapter platforms
        env:
          PLATFORM_RESULT: ${{ needs.adapter-platform.result }}
        run: test "$PLATFORM_RESULT" = success

  m0:
    name: m0
    if: always()
    needs: [rust, adapter]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete M0 gate
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          ADAPTER_RESULT: ${{ needs.adapter.result }}
        run: test "$RUST_RESULT" = success && test "$ADAPTER_RESULT" = success
