name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      structure_base:
        description: Full trusted ancestor commit for repository structure validation
        required: true
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZRYNA_STRUCTURE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.structure_base }}

jobs:
  route-contracts:
    name: route contract checks
    runs-on: ubuntu-latest
    outputs:
      diagnostics: ${{ steps.routes.outputs.diagnostics }}
      package_release: ${{ steps.routes.outputs.package_release }}
      provider_v4: ${{ steps.routes.outputs.provider_v4 }}
      wit: ${{ steps.routes.outputs.wit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Classify changed paths
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_VALIDATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL_VALIDATION" = true ]; then
            node scripts/classify-workflow-paths.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-workflow-paths.mjs \
              --git-diff "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  owned-data-quick:
    name: owned data quick (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M3 owned-data semantics
        run: pnpm m3:owned:quick

  preflight:
    name: preflight
    # #369: cold execution reached the 15-minute deadline after bootstrap completed.
    # Allow a nominal 5 minutes for other setup/cleanup beyond the 10/20-minute steps.
    timeout-minutes: 35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - name: Prepare isolated npm timing directory
        run: node scripts/collect-npm-timing.mjs prepare
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        timeout-minutes: 10
        with:
          version: 11.18.0
        env:
          npm_config_timing: 'true'
          npm_config_logs_dir: ${{ runner.temp }}/zryna-npm-bootstrap-timing
      - name: Collect numeric npm bootstrap timing
        if: ${{ !cancelled() }}
        run: node scripts/collect-npm-timing.mjs collect
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm preflight
        timeout-minutes: 20

  rust:
    name: rust (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Verify M2 semantics
        run: cargo test --locked -p zryna-semantics --lib control_flow_v1
      - name: Verify M2 driver security
        run: cargo test --locked -p zryna-driver --lib
      - name: Verify public M2 CLI profile
        run: cargo test --locked -p zryna --test cli control_flow_
      - name: Run Windows CLI smoke
        if: runner.os == 'Windows'
        run: cargo test --locked -p zryna --test cli javascript_build_and_run_publish_exact_bundles -- --exact
      - name: Verify documentation bundle contract
        run: pnpm docs:check
      - run: node scripts/run-m0-conformance.mjs

  adapter-platform:
    name: adapter (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm adapter:check
      - run: pnpm adapter:test
      - run: pnpm protocol:check
      - run: pnpm protocol:test

  adapter:
    name: adapter
    if: always()
    needs: [preflight, adapter-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify adapter platforms
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PLATFORM_RESULT: ${{ needs.adapter-platform.result }}
        run: test "$PREFLIGHT_RESULT" = success && test "$PLATFORM_RESULT" = success

  m2-platform:
    name: m2 (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm m2:check

  m2:
    name: m2
    if: always()
    needs: [m0, m2-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify M2 platforms
        env:
          M0_RESULT: ${{ needs.m0.result }}
          PLATFORM_RESULT: ${{ needs.m2-platform.result }}
        run: test "$M0_RESULT" = success && test "$PLATFORM_RESULT" = success

  m3-platform:
    name: m3 (${{ matrix.os }})
    # The complete cold Windows ownership and allocation matrix can exceed 30 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - run: pnpm m3:check

  m3:
    name: m3
    if: always()
    needs: [m0, m2, m3-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete M3 gate
        env:
          M0_RESULT: ${{ needs.m0.result }}
          M2_RESULT: ${{ needs.m2.result }}
          PLATFORM_RESULT: ${{ needs.m3-platform.result }}
        run: test "$M0_RESULT" = success && test "$M2_RESULT" = success && test "$PLATFORM_RESULT" = success

  m0:
    name: m0
    if: always()
    needs: [owned-data-quick, preflight, rust, adapter, route-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify complete M0 gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          OWNED_DATA_QUICK_RESULT: ${{ needs.owned-data-quick.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          ADAPTER_RESULT: ${{ needs.adapter.result }}
          ROUTING_RESULT: ${{ needs.route-contracts.result }}
        run: test "$OWNED_DATA_QUICK_RESULT" = success && test "$PREFLIGHT_RESULT" = success && test "$RUST_RESULT" = success && test "$ADAPTER_RESULT" = success && test "$ROUTING_RESULT" = success

  diagnostics-contract:
    name: Diagnostic protocol (${{ matrix.os }})
    if: needs.route-contracts.outputs.diagnostics == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm diagnostics:contract
      - run: cargo test --locked -p zryna-diagnostics
      - run: cargo clippy --locked -p zryna-diagnostics --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  package-release-contract:
    name: package release contract (${{ matrix.os }})
    if: needs.route-contracts.outputs.package_release == 'true'
    needs: route-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:contract

  provider-conformance-v4:
    name: Provider conformance v4 (${{ matrix.os }})
    if: needs.route-contracts.outputs.provider_v4 == 'true'
    needs: route-contracts
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm provider:conformance:v4

  wit-capability-contract:
    name: WIT capability contract (${{ matrix.os }})
    if: needs.route-contracts.outputs.wit == 'true'
    needs: route-contracts
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm wit:contract
