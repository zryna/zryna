name: Native read-only M6 evidence reader
on:
  workflow_dispatch:
    inputs:
      operator_commit: { description: Exact separately reviewed native read-only operator commit, required: true, type: string }
permissions: { contents: read, actions: read, checks: read }
env:
  SELECTED_FINAL_MAIN: 5d79dba18117a7ff41ff08d328aa94838c0fce9c
  SELECTED_FINAL_TREE: 78f42e37111204b1fb20a2363fc41fc23e62b8ef
  SELECTED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
jobs:
  read-only-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      SELECTED_CORPUS_SHA256: ${{ matrix.os == 'ubuntu-24.04' && '8eb2a64070237bd202f9d2c8850bbd57a10a0be6cc9579a0e11cee279455cace' || 'fec7b28e027892c7dd79f33be9daed2560215bdcbe585ea5e97da6dc1f3ff116' }}
    steps:
      - name: Refuse unbound selection before checkout
        shell: pwsh
        run: |
          if ($env:SELECTED_OPERATOR_COMMIT -cnotmatch '^[a-f0-9]{40}$') { throw 'Unbound operator' }
          if ($env:GITHUB_SHA -cne $env:SELECTED_OPERATOR_COMMIT) { throw 'Unapproved workflow revision' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.operator_commit }}
          path: operator
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: 5d79dba18117a7ff41ff08d328aa94838c0fce9c
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22.22.1 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: 11.18.0 }
      - name: Install exact trusted source parser dependency
        working-directory: source
        run: pnpm install --frozen-lockfile --config.package-import-method=copy
      - name: Authenticate original exact-source state and read existing observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node operator/readonly-evidence/prepare-and-run.mjs
      - name: Retain actual native reader streams and complete reviewed input data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-readonly-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-readonly-evidence/**
            operator/readonly-evidence/reader.mjs
            operator/readonly-evidence/prepare-and-run.mjs
            operator/readonly-evidence/${{ matrix.os == 'ubuntu-24.04' && 'linux' || 'windows' }}/**
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
