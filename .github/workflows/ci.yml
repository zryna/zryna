name: Fixed installed M6 supplement observations
on:
  workflow_dispatch:
    inputs:
      main_commit: { description: Exact reviewed protected main commit, required: true, type: string }
      main_tree: { description: Exact reviewed protected main tree, required: true, type: string }
      operator_commit: { description: Exact separately approved operator revision, required: true, type: string }
      ci_run: { description: Successful full42 same-source manual CI run, required: true, type: string }
      ci_attempt: { description: Exact successful attempt, required: true, type: string }
      linux_artifact: { description: Reviewed canonical Linux setup artifact id bytes sha256 expiresAt JSON, required: true, type: string }
      windows_artifact: { description: Reviewed canonical Windows setup artifact id bytes sha256 expiresAt JSON, required: true, type: string }
permissions: { contents: read, actions: read, checks: read }
env:
  SELECTED_FINAL_MAIN: ${{ inputs.main_commit }}
  SELECTED_FINAL_TREE: ${{ inputs.main_tree }}
  SELECTED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
  SELECTED_CI_RUN: ${{ inputs.ci_run }}
  SELECTED_CI_ATTEMPT: ${{ inputs.ci_attempt }}
jobs:
  supplement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SELECTED_SETUP_ARTIFACT: ${{ matrix.os == 'ubuntu-24.04' && inputs.linux_artifact || inputs.windows_artifact }}
    steps:
      - name: Refuse unbound selection before checkout
        shell: pwsh
        run: |
          foreach ($key in @('SELECTED_FINAL_MAIN','SELECTED_FINAL_TREE','SELECTED_OPERATOR_COMMIT')) {
            if ([Environment]::GetEnvironmentVariable($key) -cnotmatch '^[a-f0-9]{40}$') { throw "UNBOUND $key" }
          }
          if ($env:GITHUB_SHA -cne $env:SELECTED_OPERATOR_COMMIT) { throw 'Unapproved operator workflow revision' }
          foreach ($key in @('SELECTED_CI_RUN','SELECTED_CI_ATTEMPT')) {
            if ([Environment]::GetEnvironmentVariable($key) -cnotmatch '^[1-9][0-9]{0,14}$') { throw "UNBOUND $key" }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.operator_commit }}
          path: operator
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.main_commit }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22.22.1 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: 11.18.0 }
      - name: Locked trusted operator source dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --config.package-import-method=copy
      - name: Authenticate full main CI and exercise the exact installed setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node operator/stdio-supplement/prepare-and-run.mjs
      - name: Retain actual native captures and preparation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-m6-supplement-${{ matrix.os }}-${{ inputs.main_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-installed-supplement/**
            !${{ runner.temp }}/m6-installed-supplement/installation/**
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
