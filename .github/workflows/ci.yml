# SOURCE ONLY. Root must review/install/dispatch at an immutable operator revision separately.
name: Prospective exact-source tooling observations
on:
  workflow_dispatch:
    inputs:
      main_commit: { description: Exact root-approved source commit, required: true, type: string }
      main_tree: { description: Exact root-approved source tree, required: true, type: string }
      operator_commit: { description: Exact root-approved operator code commit, required: true, type: string }
permissions: { contents: read }
env:
  SELECTED_FINAL_MAIN: ${{ inputs.main_commit }}
  SELECTED_FINAL_TREE: ${{ inputs.main_tree }}
  SELECTED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # Fits the finite original preparation/family budgets; does not extend any native owner budget.
    timeout-minutes: 120
    steps:
      - name: Refuse unbound caller selection before checkouts
        shell: pwsh
        run: |
          foreach ($key in @('SELECTED_FINAL_MAIN','SELECTED_FINAL_TREE','SELECTED_OPERATOR_COMMIT')) {
            if ([Environment]::GetEnvironmentVariable($key) -cnotmatch '^[a-f0-9]{40}$') { throw "UNBOUND $key" }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.operator_commit }}
          path: operator
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.main_commit }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with: { toolchain: 1.97.1 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: 22.22.1 }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { version: 11.18.0 }
      - name: Locked package preparation with ordinary copied provider files
        working-directory: source
        run: pnpm install --frozen-lockfile --config.package-import-method=copy
      - name: Locked Rust dependency preparation before offline owned commands
        working-directory: source
        run: cargo fetch --locked
      - name: Fixed binary outer capture and original owned inner commands
        # Root-reviewed capsule is placed at operator/native-tooling; no generic program/phase flags.
        run: python operator/native-tooling/run-fixed.py
      - name: Retain raw observations, capsules and proofs without full target cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-source-tooling-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-tooling-outer
            ${{ runner.temp }}/native-tooling-preparation
            !${{ runner.temp }}/native-tooling-preparation/OWNED_NO_RUN_PREBUILD/target/**
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
