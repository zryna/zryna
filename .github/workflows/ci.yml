name: M6 reviewed qualification private transport E 20261019

on:
  workflow_dispatch:
    inputs:
      operator_commit: {description: Exact independently reviewed operator commit, required: true, type: string}
      packet_sha256: {description: Exact independently reviewed actual packet SHA256, required: true, type: string}
      review_sha256: {description: Exact independently reviewed actual review SHA256, required: true, type: string}

permissions:
  contents: read

concurrency:
  group: m6-410-qualification-private-transport
  cancel-in-progress: false

jobs:
  upload-reviewed-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - name: Validate selected actual packet and upload private draft once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
          APPROVED_PACKET_SHA256: ${{ inputs.packet_sha256 }}
          APPROVED_REVIEW_SHA256: ${{ inputs.review_sha256 }}
        run: node operator/qualification-upload.mjs
      - name: Retain actual transport including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-qualification-private-transport-e-20261019-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m6-qualification-upload-e-20261019
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
