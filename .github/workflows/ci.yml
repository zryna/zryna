name: Fixed private draft raw-material transport
on:
  workflow_dispatch:
    inputs:
      operator_commit:
        description: Exact separately reviewed operator commit
        required: true
        type: string
      plan_sha256:
        description: SHA256 of the complete separately reviewed closed raw-upload/plan.json
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: m6-fixed-private-draft-raw-transport
  cancel-in-progress: false
jobs:
  fixed-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse an unbound operator revision
        env:
          APPROVED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
          APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        run: |
          python3 - <<'PY'
          import os,re
          assert re.fullmatch('[a-f0-9]{40}',os.environ['APPROVED_OPERATOR_COMMIT'])
          assert re.fullmatch('[a-f0-9]{64}',os.environ['APPROVED_PLAN_SHA256'])
          assert os.environ['GITHUB_SHA']==os.environ['APPROVED_OPERATOR_COMMIT']
          assert os.environ['GITHUB_REPOSITORY']=='zryna/zryna'
          assert os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zryna/zryna
          ref: ${{ inputs.operator_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire inert pinned bytes and transport only to the fixed private draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_OPERATOR_COMMIT: ${{ inputs.operator_commit }}
          APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/raw-upload/lib
        run: /usr/bin/python3 -B raw-upload/transport.py
      - name: Retain actual transport metadata without duplicating raw payloads
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-fixed-draft-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-fixed-draft-transport/*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
