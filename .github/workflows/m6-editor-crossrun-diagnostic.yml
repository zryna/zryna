name: Independent two-OS editor cross-run diagnostic

on:
  push:
    branches: [m6-editor-crossrun-diagnostic-20261016]

permissions:
  contents: read
  actions: read

jobs:
  installed-editor:
    name: DIAGNOSTIC editor (${{ matrix.os }})
    defaults:
      run: {working-directory: product}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c9fc03ba855a37a635446dd8a6d42b1bb6f434fa
          persist-credentials: false
          path: product
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false, path: operator}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - name: Select external diagnostic base without changing runner environment
        shell: pwsh
        run: |
          $base = if ($IsLinux) { '/tmp' } else { [IO.Path]::GetFullPath($env:RUNNER_TEMP) }
          "M6_DIAGNOSTIC_BASE=$base" >> $env:GITHUB_ENV
      - name: Authenticate earlier successful portable build and acceptance (diagnostic only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne 'c9fc03ba855a37a635446dd8a6d42b1bb6f434fa') { throw 'Product commit differs' }
          if ((git show -s --format=%T HEAD) -ne '87154e66958769a266d1dc6e4368633ff782f1c8') { throw 'Product tree differs' }
          if ((git status --porcelain --untracked-files=all)) { throw 'Product checkout is dirty' }
          node ../operator/m6-crossrun-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated cross-run transport failed' }
      - name: Verify offline installed-editor controls
        shell: pwsh
        run: |
          node --test scripts/m6/installed-editor/controls.test.mjs scripts/m6/installed-editor/files.test.mjs scripts/m6/installed-editor/ownership.test.mjs scripts/m6/installed-editor/installer-metadata.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Required installed-editor controls failed' }
      - name: Acquire independently pinned official editor archive
        shell: pwsh
        run: |
          $material = [IO.Path]::GetFullPath((Join-Path $env:M6_DIAGNOSTIC_BASE 'm6-editor-material'))
          node scripts/m6/installed-editor-acquire.mjs $material
          if ($LASTEXITCODE -ne 0) { throw 'Pinned editor acquisition failed' }
      - name: Select pins from authenticated cross-run diagnostic handoff
        shell: pwsh
        run: |
          $receipt = Get-Content -LiteralPath "$env:M6_DIAGNOSTIC_BASE/m6-editor-handoff/candidate-receipt.json" -Raw | ConvertFrom-Json
          foreach ($pin in @($receipt.archive.sha256, $receipt.manifestSha256, $receipt.serverSha256, $receipt.vsixSha256)) {
            if ($pin -cnotmatch '^[a-f0-9]{64}$') { throw 'Invalid authenticated handoff pin' }
          }
          "M6_SETUP_ARCHIVE_SHA=$($receipt.archive.sha256)" >> $env:GITHUB_ENV
          "M6_SETUP_MANIFEST_SHA=$($receipt.manifestSha256)" >> $env:GITHUB_ENV
          "M6_SERVER_SHA=$($receipt.serverSha256)" >> $env:GITHUB_ENV
          "M6_VSIX_SHA=$($receipt.vsixSha256)" >> $env:GITHUB_ENV
      - name: Bind exact source
        shell: pwsh
        run: |
          "M6_SOURCE_COMMIT=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "M6_SOURCE_TREE=$(git show -s --format=%T HEAD)" >> $env:GITHUB_ENV
          "M6_SOURCE_EPOCH=$(git show -s --format=%ct HEAD)" >> $env:GITHUB_ENV
      - name: Actual Linux installed VSIX in native virtual-display editor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v Xvfb
          command -v xvfb-run
          linux_gate="$M6_DIAGNOSTIC_BASE/m6-editor-linux-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 700 "$linux_gate" "$linux_gate/tmp"
          sudo -n /usr/bin/python3 -I -B scripts/m6/installed-editor/linux-service.py "$linux_gate" \
            --handoff "$M6_DIAGNOSTIC_BASE/m6-editor-handoff" \
            --editor-archive "$M6_DIAGNOSTIC_BASE/m6-editor-material/editor.tar.gz" \
            --source-commit "$M6_SOURCE_COMMIT" --source-tree "$M6_SOURCE_TREE" \
            --source-epoch "$M6_SOURCE_EPOCH" \
            --setup-archive-sha256 "$M6_SETUP_ARCHIVE_SHA" --setup-manifest-sha256 "$M6_SETUP_MANIFEST_SHA" \
            --server-sha256 "$M6_SERVER_SHA" --vsix-sha256 "$M6_VSIX_SHA" --output "$M6_DIAGNOSTIC_BASE/m6-installed-editor"
      - name: Actual Windows installed VSIX in native GUI editor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $handoff = [IO.Path]::GetFullPath((Join-Path $env:M6_DIAGNOSTIC_BASE 'm6-editor-handoff'))
          $archive = [IO.Path]::GetFullPath((Join-Path (Join-Path $env:M6_DIAGNOSTIC_BASE 'm6-editor-material') 'editor.zip'))
          $output = [IO.Path]::GetFullPath((Join-Path $env:M6_DIAGNOSTIC_BASE 'm6-installed-editor'))
          node scripts/m6/installed-editor.mjs `
            --handoff $handoff `
            --editor-archive $archive `
            --source-commit $env:M6_SOURCE_COMMIT --source-tree $env:M6_SOURCE_TREE `
            --source-epoch $env:M6_SOURCE_EPOCH `
            --setup-archive-sha256 $env:M6_SETUP_ARCHIVE_SHA --setup-manifest-sha256 $env:M6_SETUP_MANIFEST_SHA `
            --server-sha256 $env:M6_SERVER_SHA --vsix-sha256 $env:M6_VSIX_SHA --output $output
          if ($LASTEXITCODE) { throw 'Required installed-editor acceptance failed' }
      - name: Retain actual source-bound editor observations and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m6-editor-crossrun-DIAGNOSTIC-${{ matrix.os }}-c9fc03ba-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-crossrun-input/*.json
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-installed-editor
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-linux-${{ github.run_id }}-${{ github.run_attempt }}/ROOT_RESULT.json
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-linux-${{ github.run_id }}-${{ github.run_attempt }}/SERVICE.*
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-linux-${{ github.run_id }}-${{ github.run_attempt }}/REQUEST.json
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-linux-${{ github.run_id }}-${{ github.run_attempt }}/GRANT.json
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-material/EDITOR_ARCHIVE.json
            ${{ env.M6_DIAGNOSTIC_BASE }}/m6-editor-material/official-editor-download.*
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
