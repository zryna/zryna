name: Windows artifact ZIP identity observation only
on:
  push:
    branches: [m6-windows-zip-identity-diagnostic-20261016]
permissions:
  contents: read
  actions: read
concurrency:
  group: m6-windows-zip-identity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-transport-identity:
    name: Diagnostic old artifact transport identity only
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: 22.22.1}
      - name: Select original canonical runner temporary root
        shell: pwsh
        run: |
          $base = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          "M6_DIAGNOSTIC_BASE=$base" >> $env:GITHUB_ENV
      - name: Observe final original ZIP identity predicate without changing it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          node m6-crossrun-handoff.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Transport identity observation retains original failure' }
      - name: Retain bounded metadata and exact extractor streams including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m6-windows-zip-identity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m6-crossrun-input/*.json
            ${{ runner.temp }}/m6-crossrun-input/EXTRACTOR.stdout
            ${{ runner.temp }}/m6-crossrun-input/EXTRACTOR.stderr
          if-no-files-found: error
          retention-days: 14
