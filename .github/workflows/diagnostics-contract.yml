name: Diagnostic protocol contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    name: Diagnostic protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm diagnostics:contract
      - run: cargo test --locked -p zryna-diagnostics
      - run: cargo clippy --locked -p zryna-diagnostics --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
