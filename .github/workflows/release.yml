name: Binary release

on:
  push:
    tags: [v0.2.0]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.1
  PNPM_VERSION: 11.18.0
  RUST_VERSION: 1.97.1

jobs:
  admit:
    name: admit protected release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies outside the source checkout
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Capture protected tag identity
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          mkdir -p .release/admission
          node tooling/scripts/distribution-release/create-release-tag-receipt.mjs \
            > .release/admission/tag-receipt.json
      - name: Capture exact successful protected gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tooling/scripts/distribution-release/create-preassembly-gates.mjs \
            > .release/admission/preassembly-gates.json
      - name: Reject release until every reviewed production prerequisite is present
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
        run: node tooling/scripts/distribution-release/check-release-readiness.mjs
      - name: Upload immutable admission evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/admission
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  build:
    name: build ${{ matrix.target }} replica ${{ matrix.replica }}
    needs: admit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            replica: 1
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            replica: 2
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            replica: 1
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            replica: 2
    steps:
      - name: Checkout tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          path: source
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies outside the source checkout
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download exact admission evidence from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/admission
      - name: Authenticate materials, prepare the recipe, and build one clean replica
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
          ZRYNA_TARGET: ${{ matrix.target }}
          ZRYNA_REPLICA: ${{ matrix.replica }}
        run: >-
          node tooling/scripts/distribution-release/run-protected-build.mjs
          --admission .release/admission
          --output .release/build
      - name: Upload one immutable build replica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.target }}-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/build
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  reproduce:
    name: reproduce ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download first exact build replica
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-build-${{ matrix.target }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/first
      - name: Download second exact build replica
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-build-${{ matrix.target }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/second
      - name: Compare complete archive bytes and retained deterministic evidence
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
        run: >-
          node tooling/scripts/distribution-release/compare-release-builds.mjs
          --first .release/first
          --second .release/second
          --output .release/reproduced
      - name: Upload one byte-identical reproduced subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reproduced-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  evidence:
    name: attest and sign release evidence
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download reproduced Linux subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-reproduced-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced/linux
      - name: Download reproduced Windows subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-reproduced-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced/windows
      - name: Prepare exact attestation subjects
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --output .release/publication
          --phase subjects
      - name: Attest Linux archive
        id: attest-linux
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: .release/publication/zryna-0.2.0-x86_64-unknown-linux-gnu.tar.gz
          show-summary: false
      - name: Attest Windows archive
        id: attest-windows
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: .release/publication/zryna-0.2.0-x86_64-pc-windows-msvc.zip
          show-summary: false
      - name: Bind exported attestations and prepare checksum and notes subjects
        env:
          ZRYNA_LINUX_ATTESTATION: ${{ steps.attest-linux.outputs.bundle-path }}
          ZRYNA_WINDOWS_ATTESTATION: ${{ steps.attest-windows.outputs.bundle-path }}
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --output .release/publication
          --phase documents
      - name: Sign and verify checksums and release notes
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            .release/publication/SHA256SUMS
            .release/publication/RELEASE_NOTES.md
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Finalize the canonical release envelope
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --output .release/publication
          --phase envelope
      - name: Sign and verify the canonical release envelope
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: .release/publication/zryna-release-envelope-v1.json
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Verify exact signed publication inventory without signing authority
        run: >-
          node tooling/scripts/distribution-release/verify-signed-release.mjs
          --directory .release/publication
      - name: Upload exact signed publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publication
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  publish:
    name: publish immutable GitHub prerelease
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: binary-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download exact signed bundle from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publication
      - name: Verify signed bundle before any release mutation
        run: >-
          node tooling/scripts/distribution-release/verify-signed-release.mjs
          --directory .release/publication
      - name: Create one draft prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase create-draft
      - name: Upload the exact envelope allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase upload
      - name: Re-read and verify the complete draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase verify-draft
      - name: Publish the verified prerelease once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase publish
