name: Binary release

on:
  push:
    tags: [v0.2.3]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.1
  PNPM_VERSION: 11.18.0
  RUST_VERSION: 1.97.1

jobs:
  admit:
    name: admit protected release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies outside the source checkout
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Capture protected tag identity
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          mkdir -p .release/admission
          node tooling/scripts/distribution-release/create-release-tag-receipt.mjs \
            > .release/admission/tag-receipt.json
      - name: Capture exact successful protected gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node tooling/scripts/distribution-release/create-preassembly-gates.mjs \
            > .release/admission/preassembly-gates.json
      - name: Reject release until every reviewed production prerequisite is present
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
        run: node tooling/scripts/distribution-release/check-release-readiness.mjs
      - name: Require the exact successful production candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/create-production-candidate-receipt.mjs
          > .release/admission/production-candidate-receipt.json
      - name: Upload immutable admission evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/admission
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  build:
    name: build ${{ matrix.target }} replica ${{ matrix.replica }}
    needs: admit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/zryna-bootstrap-cargo
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            replica: 1
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            replica: 2
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            replica: 1
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            replica: 2
    steps:
      - name: Checkout tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
          path: source
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies outside the source checkout
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        working-directory: source
        run: cargo fetch --locked
      - name: Bind exact Unix tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo_path="$(rustup which --toolchain 1.97.1 cargo)"
          rustc_path="$(rustup which --toolchain 1.97.1 rustc)"
          {
            echo "ZRYNA_CARGO_PATH=$cargo_path"
            echo "ZRYNA_CARGO_SHA256=$(sha256sum "$cargo_path" | cut -d' ' -f1)"
            echo "ZRYNA_RUSTC_PATH=$rustc_path"
            echo "ZRYNA_RUSTC_SHA256=$(sha256sum "$rustc_path" | cut -d' ' -f1)"
            echo "ZRYNA_RUSTUP_PATH=$(command -v rustup)"
            echo "RUSTUP_HOME=$(rustup show home)"
            echo "ZRYNA_QUALIFICATION_FETCH_PATH=/usr/local/bin:/usr/bin:/bin"
          } >> "$GITHUB_ENV"
      - name: Bind exact Windows tools and developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cargoPath = (rustup which --toolchain 1.97.1 cargo).Trim()
          $rustcPath = (rustup which --toolchain 1.97.1 rustc).Trim()
          $rustupPath = (Get-Command rustup).Source
          $vsRoot = 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" -SkipAutomaticLocation -Arch amd64 -HostArch amd64
          $msvc = Get-ChildItem "$vsRoot\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "ZRYNA_CARGO_PATH=$cargoPath" >> $env:GITHUB_ENV
          "ZRYNA_CARGO_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $cargoPath).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
          "ZRYNA_RUSTC_PATH=$rustcPath" >> $env:GITHUB_ENV
          "ZRYNA_RUSTC_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $rustcPath).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
          "ZRYNA_RUSTUP_PATH=$rustupPath" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$((rustup show home).Trim())" >> $env:GITHUB_ENV
          $nativeBin = "$($msvc.FullName)\bin\Hostx64\x64"
          "ZRYNA_LINKER_PATH=$nativeBin\link.exe" >> $env:GITHUB_ENV
          "ZRYNA_INSPECTOR_PATH=$nativeBin\dumpbin.exe" >> $env:GITHUB_ENV
          "ZRYNA_QUALIFICATION_PATH=$nativeBin;$env:SystemRoot\System32;$env:SystemRoot" >> $env:GITHUB_ENV
          "ZRYNA_QUALIFICATION_FETCH_PATH=$nativeBin;$env:SystemRoot\System32;$env:SystemRoot" >> $env:GITHUB_ENV
          "INCLUDE=$env:INCLUDE" >> $env:GITHUB_ENV
          "LIB=$env:LIB" >> $env:GITHUB_ENV
          "LIBPATH=$env:LIBPATH" >> $env:GITHUB_ENV
      - name: Download exact admission evidence from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/admission
      - name: Authenticate materials, prepare the recipe, and build one clean replica
        env:
          ZRYNA_SOURCE_ROOT: ${{ github.workspace }}/source
          ZRYNA_TARGET: ${{ matrix.target }}
          ZRYNA_REPLICA: ${{ matrix.replica }}
        run: >-
          node tooling/scripts/distribution-release/run-protected-build.mjs
          --admission .release/admission
          --output .release/build
      - name: Upload one immutable build replica
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.target }}-${{ matrix.replica }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/build
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  reproduce:
    name: reproduce ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download first exact build replica
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-build-${{ matrix.target }}-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/first
      - name: Download second exact build replica
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-build-${{ matrix.target }}-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/second
      - name: Compare complete archive bytes and retained deterministic evidence
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
        run: >-
          node tooling/scripts/distribution-release/compare-release-builds.mjs
          --first .release/first
          --second .release/second
          --output .release/reproduced
      - name: Upload one byte-identical reproduced subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reproduced-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  installed-acceptance:
    name: accept installed ${{ matrix.target }} archive
    needs: reproduce
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download exact reproduced subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-reproduced-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced
      - name: Verify, relocate, execute, and tamper-test the installed archive
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
        run: >-
          node tooling/scripts/distribution-release/run-installed-acceptance.mjs
          --input .release/reproduced
          --output .release/acceptance
          --work "${{ runner.temp }}"
      - name: Upload installed acceptance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installed-acceptance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/acceptance
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  evidence:
    name: attest and sign release evidence
    needs: [reproduce, installed-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Download reproduced Linux subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-reproduced-x86_64-unknown-linux-gnu-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced/linux
      - name: Download reproduced Windows subject
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-reproduced-x86_64-pc-windows-msvc-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reproduced/windows
      - name: Download exact admission evidence from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/admission
      - name: Prepare exact attestation subjects
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --admission .release/admission
          --output .release/publication
          --phase subjects
      - name: Attest Linux archive
        id: attest-linux
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: .release/publication/zryna-0.2.3-x86_64-unknown-linux-gnu.tar.gz
          create-storage-record: false
          show-summary: false
      - name: Attest Windows archive
        id: attest-windows
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: .release/publication/zryna-0.2.3-x86_64-pc-windows-msvc.zip
          create-storage-record: false
          show-summary: false
      - name: Bind exported attestations and prepare checksum and notes subjects
        env:
          ZRYNA_LINUX_ATTESTATION: ${{ steps.attest-linux.outputs.bundle-path }}
          ZRYNA_WINDOWS_ATTESTATION: ${{ steps.attest-windows.outputs.bundle-path }}
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --admission .release/admission
          --output .release/publication
          --phase documents
      - name: Sign and verify checksums and release notes
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: |
            .release/publication/SHA256SUMS
            .release/publication/RELEASE_NOTES.md
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Finalize the canonical release envelope
        run: >-
          node tooling/scripts/distribution-release/prepare-release-evidence.mjs
          --input .release/reproduced
          --admission .release/admission
          --output .release/publication
          --phase envelope
      - name: Sign and verify the canonical release envelope
        uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 # v3.4.0
        with:
          inputs: .release/publication/zryna-release-envelope-v1.json
          release-signing-artifacts: false
          upload-signing-artifacts: false
          verify: true
          verify-cert-identity: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Canonicalize the envelope signature bundle
        run: >-
          node tooling/scripts/distribution-release/canonicalize-envelope-signature.mjs
          --directory .release/publication
      - name: Install the pinned independent signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify exact signed publication inventory without signing authority
        run: >-
          node tooling/scripts/distribution-release/verify-signed-release.mjs
          --directory .release/publication
      - name: Upload exact signed publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publication
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1

  publish:
    name: publish immutable GitHub prerelease
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: binary-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact tagged workflow tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Install the pinned independent signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download exact signed bundle from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/publication
      - name: Verify signed bundle before any release mutation
        run: >-
          node tooling/scripts/distribution-release/verify-signed-release.mjs
          --directory .release/publication
      - name: Create one draft prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase create-draft
      - name: Upload the exact envelope allowlist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase upload
      - name: Re-read and verify the complete draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase verify-draft
      - name: Publish the verified prerelease once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node tooling/scripts/distribution-release/publish-draft-release.mjs
          --directory .release/publication --phase publish

  published-upgrade:
    name: published ${{ matrix.previous_tag }} to v0.2.3 (${{ matrix.target }})
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, previous: 0.2.1, previous_tag: v0.2.1 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, previous: 0.2.1, previous_tag: v0.2.1 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, previous: 0.2.2, previous_tag: v0.2.2 }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, previous: 0.2.2, previous_tag: v0.2.2 }
    steps:
      - name: Checkout exact tagged upgrade tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: tooling
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install tagged workflow dependencies
        run: pnpm --dir tooling install --frozen-lockfile
      - name: Install the pinned independent signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Acquire both exact immutable public releases
        env:
          GH_TOKEN: ${{ github.token }}
          ZRYNA_PREVIOUS_TAG: ${{ matrix.previous_tag }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .release/previous,.release/current | Out-Null
          gh api "repos/zryna/zryna/releases/tags/$env:ZRYNA_PREVIOUS_TAG" > .release/previous-state.json
          gh release download $env:ZRYNA_PREVIOUS_TAG --repo zryna/zryna --dir .release/previous
          gh api repos/zryna/zryna/releases/tags/v0.2.3 > .release/current-state.json
          gh release download v0.2.3 --repo zryna/zryna --dir .release/current
      - name: Exercise the Linux upgrade as an unprivileged user
        if: runner.os == 'Linux'
        shell: bash
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
          ZRYNA_PREVIOUS_VERSION: ${{ matrix.previous }}
        run: |
          mkdir -m 700 .release/upgrade-work release-evidence release-evidence/linux-upgrade
          node_path="$(command -v node)"
          cosign_path="$(command -v cosign)"
          "$node_path" tooling/scripts/distribution-release/run-published-upgrade-acceptance.mjs \
            --cosign "$cosign_path" \
            --current "$(realpath .release/current)" \
            --current-state "$(realpath .release/current-state.json)" \
            --output "$(realpath release-evidence/linux-upgrade)" \
            --previous "$(realpath .release/previous)" \
            --previous-state "$(realpath .release/previous-state.json)" \
            --previous-version "$ZRYNA_PREVIOUS_VERSION" \
            --target "$ZRYNA_TARGET" \
            --work "$(realpath .release/upgrade-work)"
      - name: Exercise the Windows upgrade as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZRYNA_TARGET: ${{ matrix.target }}
          ZRYNA_PREVIOUS_VERSION: ${{ matrix.previous }}
        run: |
          $user = 'zryna423'
          $passwordText = "Zr423-$env:GITHUB_RUN_ATTEMPT!"
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $credential = [System.Management.Automation.PSCredential]::new(".\$user", $securePassword)
          $releaseParent = (Resolve-Path .release).Path
          $userRoot = Join-Path $releaseParent 'windows-upgrade'
          $workRoot = Join-Path $userRoot 'work'
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE 'release-evidence\windows-upgrade'
          $stdout = Join-Path $userRoot 'stdout.txt'
          $stderr = Join-Path $userRoot 'stderr.txt'
          $nodeSource = (Get-Command node).Source
          $cosignSource = (Get-Command cosign).Source
          net user $user $passwordText /add /passwordchg:no
          if ($LASTEXITCODE -ne 0) { throw 'could not create the standard test user' }
          try {
            New-Item -ItemType Directory -Path $workRoot,$outputRoot -Force | Out-Null
            $node = Join-Path $userRoot 'node.exe'
            $cosign = Join-Path $userRoot 'cosign.exe'
            Copy-Item -LiteralPath $nodeSource -Destination $node
            Copy-Item -LiteralPath $cosignSource -Destination $cosign
            icacls $env:GITHUB_WORKSPACE /grant "${user}:(OI)(CI)RX" /T /Q | Out-Null
            icacls $userRoot /grant "${user}:(OI)(CI)M" /T /Q | Out-Null
            icacls $outputRoot /grant "${user}:(OI)(CI)M" /T /Q | Out-Null
            icacls $userRoot /setowner $user /T /Q | Out-Null
            icacls $outputRoot /setowner $user /T /Q | Out-Null
            $localAppData = Join-Path $userRoot 'AppData\Local'
            New-Item -ItemType Directory -Path $localAppData -Force | Out-Null
            icacls $localAppData /setowner $user /T /Q | Out-Null
            $env:USERPROFILE = $userRoot
            $env:LOCALAPPDATA = $localAppData
            $env:TEMP = $userRoot
            $env:TMP = $userRoot
            $arguments = @(
              'tooling/scripts/distribution-release/run-published-upgrade-acceptance.mjs',
              '--cosign', $cosign,
              '--current', (Resolve-Path .release/current).Path,
              '--current-state', (Resolve-Path .release/current-state.json).Path,
              '--output', $outputRoot,
              '--previous', (Resolve-Path .release/previous).Path,
              '--previous-state', (Resolve-Path .release/previous-state.json).Path,
              '--previous-version', $env:ZRYNA_PREVIOUS_VERSION,
              '--target', $env:ZRYNA_TARGET,
              '--work', $workRoot
            )
            $process = Start-Process -FilePath $node -ArgumentList $arguments `
              -WorkingDirectory $env:GITHUB_WORKSPACE -Credential $credential -LoadUserProfile `
              -WindowStyle Hidden `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            Get-Content -LiteralPath $stdout
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath $stderr
              throw "standard-user upgrade acceptance failed with exit $($process.ExitCode)"
            }
          } finally {
            net user $user /delete | Out-Null
          }
      - name: Upload exact public upgrade receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-upgrade-${{ matrix.previous }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/*-upgrade/published-upgrade-acceptance.json
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          retention-days: 1
