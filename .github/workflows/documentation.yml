name: Documentation publication

on:
  push:
    branches: [main]

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-publish:
    name: documentation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify documentation bundle contract
        run: pnpm docs:check
      - name: Export authenticated next documentation bundle
        id: docs-bundle
        run: |
          digest="$(node scripts/docs/export.mjs \
            --channel next \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref }}" \
            --output .zryna/out/docs/next)"
          printf '%s' "$digest" | grep -Eq '^[0-9a-f]{64}$'
          echo "manifest-sha256=$digest" >> "$GITHUB_OUTPUT"
          printf 'Compiler commit: `%s`\nDocumentation manifest SHA-256: `%s`\n' \
            "${{ github.sha }}" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated next documentation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zryna-docs-next-${{ github.sha }}-${{ steps.docs-bundle.outputs.manifest-sha256 }}
          path: .zryna/out/docs/next
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          # Each main update supersedes the previous next-channel candidate.
          retention-days: 7
